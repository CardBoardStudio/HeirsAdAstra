[package]
name = "gr-table"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true, features = ["alloc"] }
soroban-poseidon = { workspace = true }
ultrahonk_soroban_verifier = { path = "../../vendor/ultrahonk-soroban-verifier" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils", "alloc"] }
