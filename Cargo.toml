[workspace]
members = ["crates/game-core", "crates/galactic-reach", "crates/game", "crates/server", "crates/web"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
game = { path = "crates/game" }
game-core = { path = "crates/game-core" }
galactic-reach = { path = "crates/galactic-reach" }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1

[profile.dev.package.rquickjs-sys]
opt-level = 2

# Tests that play whole matches spend most of their time in the rival policy's
# serde_json scoring. That code is generic, so it compiles inside galactic-reach at
# galactic-reach's opt-level. Optimizing it and the dependencies makes `cargo test`
# about 4x faster. Assertions and overflow checks stay on; server, game and web
# stay unoptimized for debugging.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.galactic-reach]
opt-level = 1
