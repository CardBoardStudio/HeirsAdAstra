<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join the game · Heirs Ad Astra</title><link rel="stylesheet" href="board.css"><script defer src="pairing.js"></script></head>
<body data-role="player"><main class="pairing player-join"><p class="eyebrow">HEIRS AD ASTRA · PLAYING WITH OTHERS</p><h1 id="title">Join the game</h1><p id="status" role="status" aria-live="polite">Checking your link…</p>
<form id="join" hidden><label id="name-field">Your name<input id="name" maxlength="32" autocomplete="nickname" required></label>
<fieldset class="device-choices" id="device-field"><legend>How will you use this device?</legend>
<label class="device-choice"><input type="radio" name="device" value="hand" required><span class="picture" data-picture="hand"></span><strong>My hand</strong><small>Your cards here. The board is on another screen.</small></label>
<label class="device-choice"><input type="radio" name="device" value="game" required><span class="picture" data-picture="game"></span><strong>The whole game</strong><small>The map and your hand together here.</small></label>
</fieldset>
<button id="join-button" class="primary" type="submit">Join</button><p class="privacy" id="join-note">Your hand stays on this device. No account needed. You can change how you use this device later in the game menu.</p></form>
<p id="code"></p><button id="retry" hidden>Try again</button><p id="next" class="privacy"></p><a id="play" hidden>Open game</a><a id="manage" hidden>Manage table</a></main></body></html>
