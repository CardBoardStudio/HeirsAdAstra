<svg xmlns="http://www.w3.org/2000/svg" viewBox="9 9 182 182" role="img" aria-label="Heirs Ad Astra">
  <title>Heirs Ad Astra</title>
  <!-- Small-size emblem (37 px header): the round emblem with the long ticks only. Speed lines: one per resource, in the game's order (matter, energy,
       biomass, data); colours are the matter, energy, biomass and data custom
       properties in prototypes/galactic-reach/palette.css. -->
  <circle cx="100" cy="100" r="90.12" fill="#0d1222"/>
  <g>
    <path fill="#f2b53b" d="M101.03 24.45L101.03 100L86.84 100Z"/><path fill="#d0901f" d="M101.03 24.45L101.03 100L115.22 100Z"/>
    <path fill="#f2b53b" d="M101.03 175.55L101.03 100L115.22 100Z"/><path fill="#d0901f" d="M101.03 175.55L101.03 100L86.84 100Z"/>
    <path fill="#f2b53b" d="M175.56 100L101.03 100L101.03 96.56Z"/><path fill="#d0901f" d="M175.56 100L101.03 100L101.03 103.44Z"/>
    <path fill="#f2b53b" d="M24.44 100L101.03 100L101.03 103.44Z"/><path fill="#d0901f" d="M24.44 100L101.03 100L101.03 96.56Z"/>
    <path fill="#f2b53b" d="M55.66 59.14L101.03 100L93.55 108.31Z"/><path fill="#d0901f" d="M55.66 59.14L101.03 100L108.51 91.69Z"/>
    <path fill="#f2b53b" d="M146.73 141.14L101.03 100L108.51 91.69Z"/><path fill="#d0901f" d="M146.73 141.14L101.03 100L93.55 108.31Z"/>
  </g>
  <g transform="translate(101.03 100) rotate(-13.6) skewX(-20)">
    <!-- A navy layer behind the lines hides the star there. -->
    <g fill="#0d1222">
      <rect x="-50.1" y="-26.81" width="100.21" height="14.63"/>
      <rect x="-50.1" y="-13.81" width="100.21" height="14.63"/>
      <rect x="-36.56" y="-0.81" width="86.67" height="14.63"/>
      <rect x="-23.02" y="12.19" width="73.13" height="14.63"/>
    </g>
    <rect fill="#e9a23b" x="-46.04" y="-22.75" width="92.08" height="6.5"/>
    <rect fill="#ff6f59" x="-46.04" y="-9.75" width="92.08" height="6.5"/>
    <rect fill="#7fd6b5" x="-32.5" y="3.25" width="78.54" height="6.5"/>
    <rect fill="#5fc9d8" x="-18.96" y="16.25" width="65" height="6.5"/>
  </g>
  <!-- The rim sits on top, so nothing inside crosses it. -->
  <g fill="none" stroke="#f0b862">
    <circle cx="100" cy="100" r="87" stroke-width="6.24"/>
    <circle cx="100" cy="100" r="77" stroke-width="2.88"/>
