<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Heirs Ad Astra">
  <title>Heirs Ad Astra</title>
  <!-- Small-size emblem. Speed lines: one per resource, in the game's order (matter, energy,
       biomass, data); colours are the matter, energy, biomass and data custom
       properties in prototypes/galactic-reach/styles.css. -->
  <circle cx="100" cy="100" r="99" fill="#0c1120"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#efb75e" stroke-width="10"/>
  <g>
    <path fill="#f2b53e" d="M100 3L100 100L92.5 100Z"/><path fill="#c98a22" d="M100 3L100 100L107.5 100Z"/>
    <path fill="#f2b53e" d="M100 197L100 100L107.5 100Z"/><path fill="#c98a22" d="M100 197L100 100L92.5 100Z"/>
    <path fill="#f2b53e" d="M197 100L100 100L100 95Z"/><path fill="#c98a22" d="M197 100L100 100L100 105Z"/>
    <path fill="#f2b53e" d="M3 100L100 100L100 105Z"/><path fill="#c98a22" d="M3 100L100 100L100 95Z"/>
  </g>
  <g transform="translate(100 100) rotate(-10) skewX(-14)">
    <rect fill="#a8b7c8" x="-38" y="-28.75" width="72" height="11"/>
    <rect fill="#62c9ff" x="-33" y="-13.25" width="66" height="11"/>
    <rect fill="#70d994" x="-28" y="2.25" width="60" height="11"/>
    <rect fill="#c297ff" x="-23" y="17.75" width="54" height="11"/>
  </g>
</svg>
