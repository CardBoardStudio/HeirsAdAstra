    <g stroke-width="1.92">
      <line stroke-width="3.6" x1="178.4" y1="100" x2="185.6" y2="100"/>
      <line stroke-width="3.6" x1="167.9" y1="139.2" x2="174.13" y2="142.8"/>
      <line stroke-width="3.6" x1="139.2" y1="167.9" x2="142.8" y2="174.13"/>
      <line stroke-width="3.6" x1="100" y1="178.4" x2="100" y2="185.6"/>
      <line stroke-width="3.6" x1="60.8" y1="167.9" x2="57.2" y2="174.13"/>
      <line stroke-width="3.6" x1="32.1" y1="139.2" x2="25.87" y2="142.8"/>
      <line stroke-width="3.6" x1="21.6" y1="100" x2="14.4" y2="100"/>
      <line stroke-width="3.6" x1="32.1" y1="60.8" x2="25.87" y2="57.2"/>
      <line stroke-width="3.6" x1="60.8" y1="32.1" x2="57.2" y2="25.87"/>
      <line stroke-width="3.6" x1="100" y1="21.6" x2="100" y2="14.4"/>
