# The stable channel (docs/release.md); the Rust server serves both the API and
# Wasm UI. It deploys the `stable` branch when the Release PR merges, and Render
# previews PRs into `stable` (the Release PR). The dev channel (`main`) is
# self-hosted: deploy/dev-host.
services:
  - type: web
    name: drawing-board
    runtime: docker
    branch: stable
    plan: 0.5c-512mb
    region: ohio
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    numInstances: 1
    autoDeployTrigger: checksPass
    previews:
      generation: automatic
    envVars:
      - key: RUST_LOG
        value: info
      - key: DATABASE_PATH
        value: /app/data/drawing-board.sqlite
      # Enabled only when Render also sets IS_PULL_REQUEST=true.
      - key: PREVIEW_AUTH
        value: "1"
      - key: PREVIEW_ACCESS_CODE
        generateValue: true
