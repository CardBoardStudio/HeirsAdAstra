name: Rules contract
on:
  push:
    branches: [main, stable]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch: # the Release cut workflow starts it on release/next
permissions:
  contents: read
concurrency:
  group: rules-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  rules:
    name: Rules contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REVIEW_CONVENTIONS_HOME: .review-conventions
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The shared validator that runs .github/rules-contract.json; the pin is
      # scripts/lib/review-conventions.cjs (the tests check the two agree).
      - uses: actions/checkout@v4
        with:
          repository: bitswell-hq/review-conventions
          ref: v1
          path: .review-conventions
          persist-credentials: false
      - run: node scripts/test-rules-contract.cjs
      - run: node scripts/check-rulebook.cjs
      - if: github.event_name == 'pull_request'
        run: node scripts/check-rules-contract.cjs
