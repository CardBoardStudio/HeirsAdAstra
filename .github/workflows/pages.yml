# The player docs site at https://heirsadastra.com: the landing page, rulebook and
# release notes, built by scripts/build-site.cjs and deployed with GitHub Pages.
# Pull requests build it without deploying, so a broken build fails before merge.
name: Docs site
on:
  push:
    branches: [main]
    paths:
      - site/**
      - scripts/build-site.cjs
      - prototypes/galactic-reach/rulebook.html
      - prototypes/galactic-reach/rulebook.css
      - prototypes/galactic-reach/styles.css
      - prototypes/lab/heirs-emblem*.svg
      - docs/releases.md
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - site/**
      - scripts/build-site.cjs
      - prototypes/galactic-reach/rulebook.html
      - prototypes/galactic-reach/rulebook.css
      - prototypes/galactic-reach/styles.css
      - prototypes/lab/heirs-emblem*.svg
      - docs/releases.md
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # One deployment at a time; a newer push replaces a queued one, never a running one.
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/build-site.cjs _site
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    name: Deploy to GitHub Pages
    # A manual run from another branch builds only; the site always comes from main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages must be enabled once by a repository admin; say exactly what is missing
      # rather than leave the deploy action's generic error.
      - name: Check the Pages settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          settings="Settings → Pages: Build and deployment → Source: GitHub Actions; Custom domain: heirsadastra.com"
          if ! site=$(gh api "repos/$GITHUB_REPOSITORY/pages" 2>&1); then
            if [[ $site == *"HTTP 404"* ]]; then
              echo "::error title=GitHub Pages is not enabled::A repository admin must enable it: $settings. Then re-run this workflow."
            else
              echo "::error title=Could not read the Pages settings::$site"
            fi
            exit 1
          fi
          build_type=$(jq -r '.build_type // ""' <<<"$site")
          if [[ $build_type != workflow ]]; then
            echo "::error title=GitHub Pages does not deploy from Actions::Its source is '$build_type'. A repository admin must set $settings."
            exit 1
          fi
          cname=$(jq -r '.cname // ""' <<<"$site")
          if [[ $cname != heirsadastra.com ]]; then
            echo "::warning title=Pages custom domain is not heirsadastra.com::It is '${cname:-unset}'. A repository admin must set $settings."
          fi
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
