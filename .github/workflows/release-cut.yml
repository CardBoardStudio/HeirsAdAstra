name: Release cut
# Keeps the one "Cut: next release" PR (release/next -> main) holding the
# pending changes/ entries cut by scripts/release.cjs (docs/release.md#cut-a-release).
on:
  push:
    branches: [main]
  pull_request:
    types: [edited] # a renamed release on the cut PR
    branches: [main]
  workflow_dispatch:
    inputs:
      name:
        description: Release name for a rules-changing cut (default "Playtest <date>")
        required: false
permissions:
  contents: write # push release/next
  pull-requests: write # open and update the cut PR
  actions: write # without an App token: start CI on release/next
concurrency:
  group: release-cut
  cancel-in-progress: false
jobs:
  cut:
    name: Cut the next release
    # On the cut PR itself, only a description edit (a new release name) reruns it.
    if: >-
      github.event_name != 'pull_request' ||
      (github.head_ref == 'release/next' && github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.changes.body != null)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_APP: ${{ secrets.RELEASE_APP_ID != '' && secrets.RELEASE_APP_PRIVATE_KEY != '' }}
    steps:
      # A GitHub App token can open PRs under any Actions policy, and its push
      # starts CI on the cut PR. Without one, the workflow's GITHUB_TOKEN is used.
      - id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: scripts/release-cut.sh
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          DISPATCH_CI: ${{ env.HAS_APP != 'true' }}
          RELEASE_NAME: ${{ inputs.name }}
